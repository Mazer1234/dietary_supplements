name: Run notebook on any branch

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for lint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint

      - name: Lint with flake8
        run: |
          # Можно весь репозиторий, можно конкретный файл
          flake8 . --max-line-length=120

      - name: Lint with pylint
        run: |
          pylint 3311_bajmuhamedov_arshin_pasechny_practice_bad.py \
            --disable=C0114,C0115,C0116

  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert
          pip install -r requirements.txt

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute 3311_bajmuhamedov_arshin_pasechny_practice_bad.ipynb \
            --output 3311_bajmuhamedov_arshin_pasechny_practice_bad_executed.ipynb \
            --ExecutePreprocessor.timeout=600
      
      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: 3311_bajmuhamedov_arshin_pasechny_practice_bad_executed.ipynb
          retention-days: 30
