name: Run notebook on any branch

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert
          pip install -r requirements.txt

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute 3311_bajmuhamedov_arshin_pasechny_practice_bad.ipynb \
            --output 3311_bajmuhamedov_arshin_pasechny_practice_bad_executed.ipynb \
            --ExecutePreprocessor.timeout=600
